<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img"><title>二维圆的符号距离</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f8fafc"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" fill="#172554"><text x="30" y="43" font-size="27" text-anchor="start" fill="#172554">SDF：内部负，边界零，外部正</text><circle cx="250" cy="235" r="65" fill="none" stroke="#cbd5e1" stroke-width="2"/><circle cx="250" cy="235" r="110" fill="none" stroke="#2563eb" stroke-width="3"/><circle cx="250" cy="235" r="155" fill="none" stroke="#cbd5e1" stroke-width="2"/><path d="M80,235 L432,235" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M250,395 L250,72" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="250" cy="235" r="5" fill="#172554"/><circle cx="250" cy="70" r="5" fill="#059669"/><text x="270" y="260" font-size="20" text-anchor="start" fill="#172554">d = −1</text><text x="272" y="84" font-size="20" text-anchor="start" fill="#172554">(0, 1.5)</text><text x="310" y="160" font-size="20" text-anchor="start" fill="#172554">r = 1</text><text x="490" y="145" font-size="28" text-anchor="start" fill="#172554">d(x) = ‖x‖ − 1</text><text x="490" y="195" font-size="22" text-anchor="start" fill="#172554">零集：半径 1 的圆</text><text x="490" y="240" font-size="22" text-anchor="start" fill="#172554">中心：−1</text><text x="490" y="285" font-size="22" text-anchor="start" fill="#172554">外部点 (0, 1.5)：0.5</text><text x="490" y="350" font-size="21" text-anchor="start" fill="#172554">一般隐式场不直接给距离。</text></g></svg>