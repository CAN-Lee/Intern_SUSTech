<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img"><title>B-rep 中几何、裁剪与拓扑的关系</title><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker></defs><rect width="1080" height="440" rx="18" fill="#f8fafc"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif" fill="#172554"><text x="30" y="43" font-size="27">B-rep = 几何载体 + 裁剪边界 + 拓扑连接</text>
<g transform="translate(30 78)"><rect width="300" height="320" rx="14" fill="#fff" stroke="#dbeafe" stroke-width="2"/><text x="150" y="34" font-size="21" text-anchor="middle">① 无限几何载体 surface</text><path d="M42 224L118 72L263 117L187 270Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><path d="M77 153L222 198M96 115L241 160M60 191L205 236M100 253L176 101M145 267L221 115" stroke="#93c5fd"/><text x="150" y="297" font-size="16" text-anchor="middle" fill="#64748b">例如无限平面：o + ua + vb</text></g><path d="M342 238H382" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
<g transform="translate(390 78)"><rect width="300" height="320" rx="14" fill="#fff" stroke="#dbeafe" stroke-width="2"/><text x="150" y="34" font-size="21" text-anchor="middle">② loop 裁出有限 face</text><path d="M45 84H255V254H45ZM181 169A42 42 0 1 0 97 169A42 42 0 1 0 181 169Z" fill="#93c5fd" fill-rule="evenodd" stroke="#2563eb" stroke-width="3"/><path d="M45 84H255V254H45Z" fill="none" stroke="#1d4ed8" stroke-width="5"/><circle cx="139" cy="169" r="42" fill="none" stroke="#dc2626" stroke-width="5"/><text x="150" y="285" font-size="15" text-anchor="middle"><tspan fill="#1d4ed8">外环</tspan><tspan>保留边界，</tspan><tspan fill="#dc2626">内环</tspan><tspan>裁出孔</tspan></text><text x="150" y="307" font-size="15" text-anchor="middle" fill="#64748b">face 只是 surface 的一部分</text></g><path d="M702 238H742" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
<g transform="translate(750 78)"><rect width="300" height="320" rx="14" fill="#fff" stroke="#dbeafe" stroke-width="2"/><text x="150" y="34" font-size="21" text-anchor="middle">③ faces 连接成 shell / solid</text><path d="M55 118L150 68L245 118V230L150 281L55 230Z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2.5"/><path d="M55 118L150 168L245 118M150 168V281M150 68V168" fill="none" stroke="#1d4ed8" stroke-width="2.5"/><path d="M150 168L245 118V230L150 281Z" fill="#60a5fa" fill-opacity=".55"/><path d="M150 168L245 118" stroke="#dc2626" stroke-width="6"/><text x="216" y="158" font-size="14" fill="#dc2626">shared edge</text><text x="150" y="307" font-size="15" text-anchor="middle" fill="#64748b">相邻 face 反向使用同一 edge</text></g></g></svg>
