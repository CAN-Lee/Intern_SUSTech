<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">D²CSG：为每个目标优化双分支 CSG</title>
<desc id="desc">每阶段的损失反传到前向计算中的参数；不训练一个供所有新形状直接使用的通用 encoder。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="560" rx="18" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" fill="#172554">
<text x="32" y="45" font-size="27" font-weight="bold">D²CSG：为每个目标优化双分支 CSG</text>
<text x="34" y="92" font-size="19" fill="#475569">前向计算：同一组查询点分别进入 cover 与 residual；两分支使用独立参数</text>
<rect x="34" y="114" width="255" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="50" y="145" font-size="21" font-weight="bold">目标形状</text>
<text x="50" y="178" font-size="17">采样坐标与 occupancy</text>
<text x="50" y="203" font-size="17">随机初始化 latent / 网络</text>
<path d="M294 174H317" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="324" y="114" width="255" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="340" y="145" font-size="21" font-weight="bold">二次隐式基元</text>
<text x="340" y="178" font-size="17">网络产生两套基元参数</text>
<text x="340" y="203" font-size="17">查询点 → 隐式响应</text>
<path d="M584 174H607" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="614" y="114" width="255" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="630" y="145" font-size="21" font-weight="bold">两条 CSG 分支</text>
<text x="630" y="178" font-size="17">各自：intersection → union</text>
<text x="630" y="203" font-size="17">得到 cover 与 residual</text>
<path d="M874 174H897" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="904" y="114" width="255" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="920" y="145" font-size="21" font-weight="bold">最终差集</text>
<text x="920" y="178" font-size="17">cover 减去 residual</text>
<text x="920" y="203" font-size="17">输出：目标占据近似</text>
<text x="34" y="312" font-size="19" fill="#475569">参数更新与导出：目标 occupancy 提供重建监督；以下阶段均针对当前目标</text>
<rect x="34" y="334" width="255" height="120" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="50" y="365" font-size="21" font-weight="bold">早期优化</text>
<text x="50" y="398" font-size="17">连续选择与 union 近似</text>
<text x="50" y="423" font-size="17">重建 + 权重约束</text>
<path d="M294 394H317" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="324" y="334" width="255" height="120" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="340" y="365" font-size="21" font-weight="bold">过渡优化</text>
<text x="340" y="398" font-size="17">收紧集合运算近似</text>
<text x="340" y="423" font-size="17">继续更新连续参数</text>
<path d="M584 394H607" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="614" y="334" width="255" height="120" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="630" y="365" font-size="21" font-weight="bold">离散期优化</text>
<text x="630" y="398" font-size="17">二值化选择矩阵</text>
<text x="630" y="423" font-size="17">按删除影响做 dropout</text>
<path d="M874 394H897" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="904" y="334" width="255" height="120" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="920" y="365" font-size="21" font-weight="bold">导出固定结构</text>
<text x="920" y="398" font-size="17">保留有效基元与节点</text>
<text x="920" y="423" font-size="17">输出：紧凑 CSG</text>
<text x="34" y="524" font-size="18" fill="#475569">每阶段的损失反传到前向计算中的参数；不训练一个供所有新形状直接使用的通用 encoder。</text></g></svg>
