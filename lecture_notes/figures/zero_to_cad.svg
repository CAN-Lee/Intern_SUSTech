<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img"><title>Zero-to-CAD 的数据生成与下游训练</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f8fafc"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" fill="#172554"><text x="30" y="43" font-size="27" text-anchor="start" fill="#172554">数据生成循环，与下游模型训练分开理解</text><rect x="30" y="95" width="205" height="85" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="132.5" y="127" font-size="21" text-anchor="middle" fill="#172554">类别目录</text><text x="132.5" y="156" font-size="21" text-anchor="middle" fill="#172554">产生零件描述</text><path d="M239,137 L270,137" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="275" y="95" width="215" height="85" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="382.5" y="127" font-size="21" text-anchor="middle" fill="#172554">LLM 提出代码</text><text x="382.5" y="156" font-size="21" text-anchor="middle" fill="#172554">工具文档辅助</text><path d="M495,137 L525,137" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="530" y="95" width="240" height="85" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="650.0" y="127" font-size="21" text-anchor="middle" fill="#172554">执行 / 几何 / 导出</text><text x="650.0" y="156" font-size="21" text-anchor="middle" fill="#172554">分层验证</text><path d="M775,137 L805,137" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="810" y="95" width="275" height="85" rx="12" fill="#d1fae5" stroke="#cbd5e1"/><text x="947.5" y="127" font-size="21" text-anchor="middle" fill="#172554">保存成功程序与几何</text><text x="947.5" y="156" font-size="21" text-anchor="middle" fill="#172554">构成合成数据集</text><path d="M650,185 L650,233 L380,233 L380,185" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="510" y="266" font-size="20" text-anchor="middle" fill="#172554">失败反馈 → 修改 → 重试</text><path d="M947,185 L947,313" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="400" y="320" width="685" height="80" rx="12" fill="#e0e7ff" stroke="#cbd5e1"/><text x="742.5" y="352" font-size="21" text-anchor="middle" fill="#172554">多视图与程序配对 → 微调 → 图像到代码</text><text x="30" y="421" font-size="22" text-anchor="start" fill="#172554">验证成功 ≠ 描述完全满足 ≠ 制造可行</text></g></svg>