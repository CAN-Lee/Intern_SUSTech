<path d="M1030 238V267H22V394H28" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="34" y="524" font-size="18" fill="#475569">代理反馈修改样本；SFT 更新模型权重。数据有效、代码可执行与满足设计意图是不同评价目标。</text></g></svg>
