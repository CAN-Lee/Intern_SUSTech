<rect x="904" y="334" width="255" height="120" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="920" y="365" font-size="21" font-weight="bold">执行与评价</text>
<text x="920" y="398" font-size="17">报告代码成功率</text>
