<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Zero-to-CAD：合成数据引擎与下游模型</title>
<desc id="desc">代理反馈修改样本；SFT 更新模型权重。数据有效、代码可执行与满足设计意图是不同评价目标。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="560" rx="18" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" fill="#172554">
<text x="32" y="45" font-size="27" font-weight="bold">Zero-to-CAD：合成数据引擎与下游模型</text>
<text x="34" y="92" font-size="19" fill="#475569">数据生成：工具错误反馈用于修复当前代码；设置有限的尝试预算</text>
<rect x="34" y="114" width="255" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="50" y="145" font-size="21" font-weight="bold">类别与描述目录</text>
<text x="50" y="178" font-size="17">生成、整理与去重</text>
<text x="50" y="203" font-size="17">形成零件描述</text>
<path d="M294 174H317" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="324" y="114" width="255" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="340" y="145" font-size="21" font-weight="bold">代码生成代理</text>
<text x="340" y="178" font-size="17">LLM + 文档查找</text>
<text x="340" y="203" font-size="17">生成 CadQuery 程序</text>
<path d="M584 174H607" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="614" y="114" width="255" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="630" y="145" font-size="21" font-weight="bold">执行 / 修复循环</text>
<text x="630" y="178" font-size="17">执行、几何、导出检查</text>
<text x="630" y="203" font-size="17">错误 → 改代码 → 重试</text>
<path d="M874 174H897" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="904" y="114" width="255" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="920" y="145" font-size="21" font-weight="bold">保存合成样本</text>
<text x="920" y="178" font-size="17">程序 + 实体 + 渲染图</text>
<text x="920" y="203" font-size="17">另提供聚类精选集</text>
<text x="34" y="312" font-size="19" fill="#475569">下游模型：原文用完整数据集训练；精选集是另一种数据产物</text>
<rect x="34" y="334" width="255" height="120" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="50" y="365" font-size="21" font-weight="bold">多视图与代码配对</text>
<text x="50" y="398" font-size="17">每例八张 256×256 图</text>
<text x="50" y="423" font-size="17">划分 train / val / test</text>
<path d="M294 394H317" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="324" y="334" width="255" height="120" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="340" y="365" font-size="21" font-weight="bold">监督微调 SFT</text>
<text x="340" y="398" font-size="17">Qwen3-VL-2B</text>
<text x="340" y="423" font-size="17">next-token 代码预测</text>
<path d="M584 394H607" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="614" y="334" width="255" height="120" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="630" y="365" font-size="21" font-weight="bold">新目标多视图</text>
<text x="630" y="398" font-size="17">微调模型生成代码</text>
<text x="630" y="423" font-size="17">不等同数据代理修复</text>
