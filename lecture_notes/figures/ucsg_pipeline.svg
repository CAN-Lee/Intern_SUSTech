<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">UCSG-Net：训练可微结构，推断导出离散 CSG</title>
<desc id="desc">输入形状决定整棵树；空间查询点只评价该树。训练时的软混合与导出后的硬结构要分别检查。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="560" rx="18" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" fill="#172554">
<text x="32" y="45" font-size="27" font-weight="bold">UCSG-Net：训练可微结构，推断导出离散 CSG</text>
<text x="34" y="92" font-size="19" fill="#475569">训练：多个形状提供几何监督；重建损失反传到 encoder、基元预测和选择参数</text>
<rect x="34" y="114" width="255" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="50" y="145" font-size="21" font-weight="bold">图像 / 体素</text>
<text x="50" y="178" font-size="17">2D / 3D encoder</text>
<text x="50" y="203" font-size="17">输出：形状潜码 z</text>
<path d="M294 174H317" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="324" y="114" width="255" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="340" y="145" font-size="21" font-weight="bold">基元预测</text>
<text x="340" y="178" font-size="17">尺寸、旋转、平移</text>
<text x="340" y="203" font-size="17">查询点 → 基元 occupancy</text>
<path d="M584 174H607" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="614" y="114" width="255" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="630" y="145" font-size="21" font-weight="bold">可微 CSG 层</text>
<text x="630" y="178" font-size="17">选择左右操作数</text>
<text x="630" y="203" font-size="17">生成并、交、双向差</text>
<path d="M874 174H897" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="904" y="114" width="255" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="920" y="145" font-size="21" font-weight="bold">训练损失</text>
<text x="920" y="178" font-size="17">目标 occupancy 与正则</text>
<text x="920" y="203" font-size="17">分阶段收紧离散选择</text>
<text x="34" y="312" font-size="19" fill="#475569">推断：使用训练好的网络；不运行上面的训练循环</text>
<rect x="34" y="334" width="255" height="120" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="50" y="365" font-size="21" font-weight="bold">新形状 → 网络</text>
<text x="50" y="398" font-size="17">得到基元参数</text>
<text x="50" y="423" font-size="17">以及操作数选择</text>
<path d="M294 394H317" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="324" y="334" width="255" height="120" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="340" y="365" font-size="21" font-weight="bold">硬选择与回溯</text>
<text x="340" y="398" font-size="17">从最终节点回溯</text>
<text x="340" y="423" font-size="17">固定离散操作数</text>
<path d="M584 394H607" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="614" y="334" width="255" height="120" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="630" y="365" font-size="21" font-weight="bold">删除未用分支</text>
<text x="630" y="398" font-size="17">保留输出所需节点</text>
<text x="630" y="423" font-size="17">形成 CSG 树</text>
<path d="M874 394H897" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="904" y="334" width="255" height="120" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="920" y="365" font-size="21" font-weight="bold">执行 CSG</text>
<text x="920" y="398" font-size="17">基元 + 布尔关系</text>
<text x="920" y="423" font-size="17">输出：重建实体</text>
<text x="34" y="524" font-size="18" fill="#475569">输入形状决定整棵树；空间查询点只评价该树。训练时的软混合与导出后的硬结构要分别检查。</text></g></svg>
