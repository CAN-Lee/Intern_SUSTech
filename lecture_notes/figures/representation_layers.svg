<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img"><title>同一个圆柱体的四种几何表示</title><defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#bfdbfe"/><stop offset="1" stop-color="#60a5fa"/></linearGradient><pattern id="g" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#cbd5e1"/></pattern></defs><rect width="1120" height="430" rx="18" fill="#f8fafc"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif" fill="#172554"><text x="30" y="43" font-size="27">同一个物体，不同 representation 保存的信息不同</text>
<g transform="translate(25 70)"><rect width="250" height="325" rx="14" fill="#fff" stroke="#dbeafe" stroke-width="2"/><text x="125" y="36" font-size="23" text-anchor="middle">Point cloud</text><g fill="#2563eb"><circle cx="64" cy="92" r="4"/><circle cx="89" cy="75" r="4"/><circle cx="123" cy="68" r="4"/><circle cx="158" cy="74" r="4"/><circle cx="187" cy="91" r="4"/><circle cx="56" cy="122" r="4"/><circle cx="91" cy="105" r="4"/><circle cx="128" cy="100" r="4"/><circle cx="166" cy="107" r="4"/><circle cx="195" cy="125" r="4"/><circle cx="57" cy="168" r="4"/><circle cx="87" cy="181" r="4"/><circle cx="126" cy="187" r="4"/><circle cx="168" cy="180" r="4"/><circle cx="195" cy="165" r="4"/><circle cx="58" cy="220" r="4"/><circle cx="88" cy="238" r="4"/><circle cx="125" cy="244" r="4"/><circle cx="165" cy="237" r="4"/><circle cx="194" cy="218" r="4"/></g><text x="125" y="280" font-size="17" text-anchor="middle">坐标样本</text><text x="125" y="305" font-size="16" text-anchor="middle" fill="#64748b">没有连接、内部或曲面类型</text></g>
<g transform="translate(298 70)"><rect width="250" height="325" rx="14" fill="#fff" stroke="#dbeafe" stroke-width="2"/><text x="125" y="36" font-size="23" text-anchor="middle">Triangle mesh</text><g fill="url(#s)" stroke="#2563eb" stroke-width="1.3"><path d="M47 92Q125 42 203 92V220Q125 270 47 220Z"/><path d="M47 92Q125 142 203 92Q125 42 47 92Z" fill="#dbeafe"/><path d="M47 92L85 112L47 156M85 112L125 122L47 156M47 156L125 122L47 220M47 220L125 122L86 241M125 122L203 92L203 156M125 122L203 156L203 220M125 122L203 220L164 241M86 241L125 122L164 241M47 92L125 72L85 112M125 72L203 92L165 112M85 112L125 72L165 112L125 122" fill="none"/></g><text x="125" y="280" font-size="17" text-anchor="middle">顶点 + 三角形连接</text><text x="125" y="305" font-size="16" text-anchor="middle" fill="#64748b">曲面被离散近似</text></g>
<g transform="translate(571 70)"><rect width="250" height="325" rx="14" fill="#fff" stroke="#dbeafe" stroke-width="2"/><text x="125" y="36" font-size="23" text-anchor="middle">B-rep</text><path d="M48 94Q125 44 202 94V218Q125 268 48 218Z" fill="url(#s)" stroke="#1d4ed8" stroke-width="2.5"/><path d="M48 94Q125 144 202 94Q125 44 48 94Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/><path d="M48 218Q125 268 202 218" fill="none" stroke="#1d4ed8" stroke-width="2.5"/><circle cx="48" cy="94" r="4.5" fill="#dc2626"/><circle cx="202" cy="94" r="4.5" fill="#dc2626"/><path d="M205 126L224 112" stroke="#dc2626"/><text x="226" y="110" font-size="14" fill="#dc2626">edge</text><text x="125" y="280" font-size="17" text-anchor="middle">解析曲面 + 裁剪拓扑</text><text x="125" y="305" font-size="16" text-anchor="middle" fill="#64748b">圆柱面、平面、边与连接</text></g>
<g transform="translate(844 70)"><rect width="250" height="325" rx="14" fill="#fff" stroke="#dbeafe" stroke-width="2"/><text x="125" y="36" font-size="23" text-anchor="middle">Implicit / SDF</text><rect x="34" y="62" width="182" height="190" fill="url(#g)"/><path d="M62 102Q125 61 188 102V208Q125 249 62 208Z" fill="#dbeafe" fill-opacity=".8" stroke="#2563eb" stroke-width="3"/><path d="M62 102Q125 143 188 102Q125 61 62 102Z" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><text x="125" y="157" font-size="18" text-anchor="middle" fill="#1e40af">f(x) &lt; 0</text><text x="125" y="280" font-size="17" text-anchor="middle">空间中每一点的函数值</text><text x="125" y="305" font-size="16" text-anchor="middle" fill="#64748b">零水平集定义边界</text></g></g></svg>
