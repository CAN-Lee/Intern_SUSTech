<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">SuperFit：逐形状残差拟合</title>
<desc id="desc">虚线：继续拟合时回到残差计算。该流程每个目标运行一次；不是训练后的单次前向预测。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="560" rx="18" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" fill="#172554">
<text x="32" y="45" font-size="27" font-weight="bold">SuperFit：逐形状残差拟合</text>
<text x="34" y="92" font-size="19" fill="#475569">① 当前装配决定残差；从残差提出新基元</text>
<rect x="34" y="114" width="255" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="50" y="145" font-size="21" font-weight="bold">目标 + 当前装配</text>
<text x="50" y="178" font-size="17">输入：目标距离场</text>
<text x="50" y="203" font-size="17">输出：未解释区域</text>
<path d="M294 174H317" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="324" y="114" width="255" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="340" y="145" font-size="21" font-weight="bold">MSD 分解</text>
<text x="340" y="178" font-size="17">腐蚀与连通区域恢复</text>
<text x="340" y="203" font-size="17">输出：初始化区域</text>
<path d="M584 174H607" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="614" y="114" width="255" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="630" y="145" font-size="21" font-weight="bold">区域几何初始化</text>
<text x="630" y="178" font-size="17">PCA、截面与轴向分析</text>
<text x="630" y="203" font-size="17">输出：形状参数与位姿</text>
<path d="M874 174H897" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="904" y="114" width="255" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="920" y="145" font-size="21" font-weight="bold">追加 SuperFrusta</text>
<text x="920" y="178" font-size="17">保留已有基元</text>
<text x="920" y="203" font-size="17">形成待优化装配</text>
<text x="34" y="312" font-size="19" fill="#475569">② 新旧基元共同优化；尚有残差时重复上面的步骤</text>
<rect x="34" y="334" width="255" height="120" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="50" y="365" font-size="21" font-weight="bold">联合优化</text>
<text x="50" y="398" font-size="17">重建 + 数量 + 质量损失</text>
<text x="50" y="423" font-size="17">更新全部连续参数</text>
<path d="M294 394H317" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="324" y="334" width="255" height="120" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="340" y="365" font-size="21" font-weight="bold">剪枝与评分</text>
<text x="340" y="398" font-size="17">测试删除冗余基元</text>
<text x="340" y="423" font-size="17">更新最佳装配</text>
<path d="M584 394H607" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="614" y="334" width="255" height="120" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="630" y="365" font-size="21" font-weight="bold">检查终止条件</text>
<text x="630" y="398" font-size="17">评分饱和 / 无有效区域</text>
<text x="630" y="423" font-size="17">或达到拟合预算</text>
<path d="M874 394H897" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="904" y="334" width="255" height="120" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="920" y="365" font-size="21" font-weight="bold">最终输出</text>
<text x="920" y="398" font-size="17">形状参数、位姿与软并</text>
<text x="920" y="423" font-size="17">保存最佳装配</text>
<path d="M1030 238V267H22V394H28" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M740 457V479H8V174H28" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="34" y="524" font-size="18" fill="#475569">虚线：继续拟合时回到残差计算。该流程每个目标运行一次；不是训练后的单次前向预测。</text></g></svg>
