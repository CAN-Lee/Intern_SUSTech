<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">CADFit：几何候选 → CAD 程序 → 残差修复</title>
<desc id="desc">Hybrid：学习筛选 + 连续参数搜索 + 离散组装。最终程序能重建几何，不保证还原原始设计历史。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="560" rx="18" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" fill="#172554">
<text x="32" y="45" font-size="27" font-weight="bold">CADFit：几何候选 → CAD 程序 → 残差修复</text>
<text x="34" y="92" font-size="19" fill="#475569">① 逐目标搜索：预训练 sketch prior 帮助筛选；CAD 内核执行并检查候选</text>
<rect x="34" y="114" width="255" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="50" y="145" font-size="21" font-weight="bold">水密目标 Mesh</text>
<text x="50" y="178" font-size="17">平面检测与切片</text>
<text x="50" y="203" font-size="17">提取草图轮廓</text>
<path d="M294 174H317" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="324" y="114" width="255" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="340" y="145" font-size="21" font-weight="bold">Sketch prior 筛选</text>
<text x="340" y="178" font-size="17">多视图 + 候选轮廓</text>
<text x="340" y="203" font-size="17">保留有用草图</text>
<path d="M584 174H607" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="614" y="114" width="255" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="630" y="145" font-size="21" font-weight="bold">参数扫描</text>
<text x="630" y="178" font-size="17">Extrude / Revolve</text>
<text x="630" y="203" font-size="17">生成候选实体</text>
<path d="M874 174H897" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="904" y="114" width="255" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="920" y="145" font-size="21" font-weight="bold">基础组装</text>
<text x="920" y="178" font-size="17">按 IoU 前向选择</text>
<text x="920" y="203" font-size="17">后向移除冗余候选</text>
<text x="34" y="312" font-size="19" fill="#475569">② 根据缺失和多余体积修复程序；残差步骤可在预算内重复</text>
<rect x="34" y="334" width="255" height="120" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="50" y="365" font-size="21" font-weight="bold">计算两类残差</text>
<text x="50" y="398" font-size="17">missing = 目标 − 当前</text>
<text x="50" y="423" font-size="17">excess = 当前 − 目标</text>
<path d="M294 394H317" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="324" y="334" width="255" height="120" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="340" y="365" font-size="21" font-weight="bold">重建残差并更新</text>
<text x="340" y="398" font-size="17">missing → Union</text>
<text x="340" y="423" font-size="17">excess → Cut</text>
<path d="M584 394H607" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="614" y="334" width="255" height="120" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="630" y="365" font-size="21" font-weight="bold">边特征搜索</text>
<text x="630" y="398" font-size="17">Fillet / Chamfer</text>
<text x="630" y="423" font-size="17">搜索有效尺寸</text>
<path d="M874 394H897" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="904" y="334" width="255" height="120" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="920" y="365" font-size="21" font-weight="bold">执行与导出</text>
<text x="920" y="398" font-size="17">检查更新后的程序</text>
<text x="920" y="423" font-size="17">输出：CAD 历史与实体</text>
<path d="M1030 238V267H22V394H28" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="34" y="524" font-size="18" fill="#475569">Hybrid：学习筛选 + 连续参数搜索 + 离散组装。最终程序能重建几何，不保证还原原始设计历史。</text></g></svg>
