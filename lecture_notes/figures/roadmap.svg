<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img"><title>学习路线与输出表示</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f8fafc"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" fill="#172554"><text x="35" y="45" font-size="27" text-anchor="start" fill="#172554">先理解表示，再理解如何恢复结构</text><rect x="35" y="85" width="225" height="85" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="147.5" y="117" font-size="21" text-anchor="middle" fill="#172554">01–02 几何与数学</text><text x="147.5" y="146" font-size="21" text-anchor="middle" fill="#172554">B-rep / 隐式 / CSG</text><path d="M263,127 L295,127" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="300" y="85" width="225" height="85" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="412.5" y="117" font-size="21" text-anchor="middle" fill="#172554">03 SuperFit</text><text x="412.5" y="146" font-size="21" text-anchor="middle" fill="#172554">可编辑基元装配</text><path d="M530,127 L560,127" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="565" y="85" width="235" height="85" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="682.5" y="117" font-size="21" text-anchor="middle" fill="#172554">04 UCSG / D²CSG</text><text x="682.5" y="146" font-size="21" text-anchor="middle" fill="#172554">离散布尔结构</text><path d="M805,127 L835,127" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="840" y="85" width="245" height="85" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="962.5" y="117" font-size="21" text-anchor="middle" fill="#172554">05 CADFit</text><text x="962.5" y="146" font-size="21" text-anchor="middle" fill="#172554">CAD 操作与引用</text><path d="M960,174 L960,223" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="82