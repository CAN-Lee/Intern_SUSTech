<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="425" viewBox="0 0 1100 425" role="img"><title>ResFit 的分析优化闭环</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f8fafc"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" fill="#172554"><text x="30" y="43" font-size="27" text-anchor="start" fill="#172554">ResFit：新增基元，重新调整整个装配</text><rect x="30" y="95" width="210" height="85" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="135.0" y="127" font-size="21" text-anchor="middle" fill="#172554">目标 − 已解释区域</text><text x="135.0" y="156" font-size="21" text-anchor="middle" fill="#172554">得到 residual</text><path d="M245,137 L280,137" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="285" y="95" width="215" height="85" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="392.5" y="127" font-size="21" text-anchor="middle" fill="#172554">MSD + 初始化</text><text x="392.5" y="156" font-size="21" text-anchor="middle" fill="#172554">分析厚度与方向</text><path d="M505,137 L540,137" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="545" y="95" width="230" height="85" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="660.0" y="127" font-size="21" text-anchor="middle" fill="#172554">新旧基元共同优化</text><text x="660.0" y="156" font-size="21" text-anchor="middle" fill="#172554">重建 + 紧凑 + 质量</text><path d="M780,137 L815,137" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="820" y="95" width="250" height="85" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="945.0" y="127" font-size="21" text-anchor="middle" fill="#172554">实际删除测试</text><text x="945.0" y="156" font-size="21" text-anchor="middle" fill="#172554">保留更好的程序</text><path d="M945,185 L945,265 L135,265 L135,185" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="550" y="302" font-size="22" text-anchor="middle" fill="#172554">更新残差，再提出结构；目标饱和或预算耗尽时停止</text><text x="30" y="370" font-size="23" text-anchor="start" fill="#172554">早加入的基元不会自动冻结；一轮也可能新增多个基元。</text></g></svg>